<style>
  /* Pair views are HTML fragments injected into Homey's own page — no doctype/head/body,
     and no /homey.js include (Homey provides the object + calls onHomeyReady). */
  #navien-start { max-width:520px; margin:0 auto; padding:24px 16px; text-align:center;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:#1b1b1f; }
  #navien-start .card { background:#fff; border:1px solid #e2e2e8; border-radius:10px; padding:24px 16px; }
  #navien-start p { margin:0 0 14px; color:#66666e; }
  #navien-start button { padding:10px 18px; border:0; border-radius:6px; background:#E2001A; color:#fff;
    font-size:15px; cursor:pointer; }
  #navien-start .spinner { display:inline-block; width:18px; height:18px; border:3px solid #d9d9e0;
    border-top-color:#E2001A; border-radius:50%; animation:navspin .8s linear infinite; }
  @keyframes navspin { to { transform:rotate(360deg); } }
</style>

<div id="navien-start">
  <div class="card">
    <p id="msg"><span class="spinner"></span></p>
    <button id="login" style="display:none">로그인</button>
  </div>
</div>

<script type="text/javascript">
  // onHomeyReady is unreliable across Homey versions, and the Homey global starts life
  // as a constructor whose ready instance arrives later — so trigger init through every
  // mechanism, check that ready/emit are actually functions, and let `started` dedupe.
  var started = false, H = null;
  function usable(o) { return !!o && typeof o.ready === "function" && typeof o.emit === "function"; }

  function run(homeyObj) {
    if (started) return;
    var ref = usable(homeyObj) ? homeyObj
            : (typeof Homey !== "undefined" && usable(Homey) ? Homey : null);
    if (!ref) return;
    if (!document.getElementById("msg")) return;
    started = true; H = ref;
    try { H.ready(); } catch (e) { /* ignore */ }
    flow();
  }

  function flow() {
    var msg = document.getElementById("msg");
    var btn = document.getElementById("login");
    var settled = false;
    function toLogin(reason) {
      if (settled) return;
      settled = true;
      msg.textContent = reason || "나비엔 계정 로그인이 필요합니다.";
      btn.style.display = "inline-block";
      btn.onclick = function () { H.showView("login_credentials"); };
    }
    function toList() { if (settled) return; settled = true; H.showView("list_devices"); }

    setTimeout(function () { toLogin("나비엔 계정 로그인이 필요합니다."); }, 8000);
    Promise.resolve(H.emit("check_session", {}))
      .then(function (res) { if (res && res.ready) { toList(); } else { toLogin(res && res.reason); } })
      .catch(function (err) { toLogin(String((err && err.message) || err)); });
  }

  function onHomeyReady(homeyObj) { run(homeyObj); }
  document.addEventListener("DOMContentLoaded", function () { run(); });
  window.addEventListener("load", function () { run(); });
  (function poll(n) { if (started || n <= 0) return; run(); setTimeout(function () { poll(n - 1); }, 100); })(80);
</script>
