<style>
  #navien-home { max-width:520px; margin:0 auto; padding:20px 16px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:#1b1b1f; }
  #navien-home .card { background:#fff; border:1px solid #e2e2e8; border-radius:10px; padding:20px 16px; }
  #navien-home h2 { font-size:17px; margin:0 0 12px; }
  #navien-home p { margin:0 0 12px; color:#66666e; text-align:center; }
  #navien-home button.home { display:block; width:100%; margin:8px 0; padding:12px; border:1px solid #e2e2e8;
    border-radius:8px; background:#fafafc; color:#1b1b1f; font-size:15px; cursor:pointer; text-align:left; }
  #navien-home button.home:hover { border-color:#E2001A; }
  #navien-home .spinner { display:inline-block; width:18px; height:18px; border:3px solid #d9d9e0;
    border-top-color:#E2001A; border-radius:50%; animation:navspin .8s linear infinite; }
  @keyframes navspin { to { transform:rotate(360deg); } }
</style>

<div id="navien-home">
  <div class="card">
    <h2>집(home) 선택</h2>
    <p id="msg"><span class="spinner"></span></p>
    <div id="homes"></div>
  </div>
</div>

<script type="text/javascript">
  var started = false, H = null;
  function usable(o) { return !!o && typeof o.ready === "function" && typeof o.emit === "function"; }

  function run(homeyObj) {
    if (started) return;
    var ref = usable(homeyObj) ? homeyObj
            : (typeof Homey !== "undefined" && usable(Homey) ? Homey : null);
    if (!ref) return;
    if (!document.getElementById("homes")) return;
    started = true; H = ref;
    try { H.ready(); } catch (e) { /* ignore */ }
    flow();
  }

  function flow() {
    var msg = document.getElementById("msg");
    var box = document.getElementById("homes");
    var settled = false;
    function advance() { if (settled) return; settled = true; H.showView("list_devices"); }
    // The account almost always has one home, already saved at login, so if home lookup
    // stalls just move on to the device list rather than spinning forever.
    var fallback = setTimeout(advance, 12000);
    Promise.resolve(H.emit("list_homes", {}))
      .then(function (homes) {
        if (settled) return;
        if (!homes || homes.length <= 1) { clearTimeout(fallback); advance(); return; }
        clearTimeout(fallback);
        settled = true;
        msg.style.display = "none";
        homes.forEach(function (h) {
          var b = document.createElement("button");
          b.className = "home"; b.textContent = h.name;
          b.onclick = function () {
            b.disabled = true;
            H.emit("select_home", { seq: h.seq }).then(function () { H.showView("list_devices"); });
          };
          box.appendChild(b);
        });
      })
      .catch(function () { clearTimeout(fallback); advance(); });
  }

  function onHomeyReady(homeyObj) { run(homeyObj); }
  document.addEventListener("DOMContentLoaded", function () { run(); });
  window.addEventListener("load", function () { run(); });
  (function poll(n) { if (started || n <= 0) return; run(); setTimeout(function () { poll(n - 1); }, 100); })(80);
</script>
