<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --red:#E2001A; --bg:#f2f2f5; --card:#fff; --text:#1b1b1f; --muted:#66666e; --border:#e2e2e8; }
    * { box-sizing:border-box; }
    html, body { background:var(--bg) !important; }
    body { margin:0; color:var(--text); font-size:14px; line-height:1.5;
           font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width:520px; margin:0 auto; padding:24px 16px; text-align:center; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px 16px; }
    p { margin:0 0 14px; color:var(--muted); }
    button { padding:10px 18px; border:0; border-radius:6px; background:var(--red); color:#fff;
             font-size:15px; cursor:pointer; }
    .spinner { display:inline-block; width:18px; height:18px; border:3px solid #d9d9e0;
               border-top-color:var(--red); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <p id="msg"><span class="spinner"></span></p>
    <button id="login" style="display:none">로그인</button>
  </div></div>

  <script type="text/javascript" src="/homey.js" data-origin="pair"></script>
  <script type="text/javascript">
    function onHomeyReady(Homey) {
      var msg = document.getElementById("msg");
      var btn = document.getElementById("login");

      function toLogin(reason) {
        msg.textContent = reason || "나비엔 계정 로그인이 필요합니다.";
        btn.style.display = "inline-block";
        btn.onclick = function () { Homey.showView("login_credentials"); };
      }

      // Try the saved account. If it works, skip the login form entirely and go
      // straight to the device list; otherwise fall back to the login view.
      Promise.resolve(Homey.emit("check_session", {}))
        .then(function (res) {
          if (res && res.ready) { Homey.showView("list_devices"); }
          else { toLogin(res && res.reason); }
        })
        .catch(function (err) { toLogin(String((err && err.message) || err)); });

      Homey.ready();
    }
  </script>
</body>
</html>
