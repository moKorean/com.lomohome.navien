<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --red:#E2001A; --bg:#f2f2f5; --card:#fff; --text:#1b1b1f; --muted:#66666e; --border:#e2e2e8; }
    * { box-sizing: border-box; }
    html, body { background: var(--bg) !important; }
    body { margin:0; color:var(--text); font-size:14px; line-height:1.5;
           font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width:520px; margin:0 auto; padding:20px 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px 16px; }
    h2 { font-size:17px; margin:0 0 12px; }
    p { margin:0 0 12px; color:var(--muted); text-align:center; }
    button.home { display:block; width:100%; margin:8px 0; padding:12px; border:1px solid var(--border);
                  border-radius:8px; background:#fafafc; color:var(--text); font-size:15px; cursor:pointer;
                  text-align:left; }
    button.home:hover { border-color:var(--red); }
    button.home[disabled] { opacity:.55; }
    .spinner { display:inline-block; width:18px; height:18px; border:3px solid #d9d9e0;
               border-top-color:var(--red); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h2>집(home) 선택</h2>
    <p id="msg"><span class="spinner"></span></p>
    <div id="homes"></div>
  </div></div>

  <script type="text/javascript" src="/homey.js" data-origin="pair"></script>
  <script type="text/javascript">
    function onHomeyReady(Homey) {
      var msg = document.getElementById("msg");
      var box = document.getElementById("homes");

      Promise.resolve(Homey.emit("list_homes", {}))
        .then(function (homes) {
          if (!homes || homes.length === 0) { Homey.showView("list_devices"); return; }
          if (homes.length === 1) {
            Homey.emit("select_home", { seq: homes[0].seq })
              .then(function () { Homey.showView("list_devices"); });
            return;
          }
          msg.style.display = "none";
          homes.forEach(function (h) {
            var b = document.createElement("button");
            b.className = "home";
            b.textContent = h.name;
            b.onclick = function () {
              b.disabled = true;
              Homey.emit("select_home", { seq: h.seq })
                .then(function () { Homey.showView("list_devices"); });
            };
            box.appendChild(b);
          });
        })
        .catch(function (err) { msg.textContent = String((err && err.message) || err); });

      Homey.ready();
    }
  </script>
</body>
</html>
