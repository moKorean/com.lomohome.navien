name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # No lockfile is committed (uv.lock is gitignored), so there is nothing
          # to key a cache on; disabling it avoids the "cache never invalidates" warning.
          enable-cache: false
      - name: Set up Python 3.14
        run: uv python install 3.14
      - name: Create venv and install
        run: |
          uv venv --python 3.14
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
